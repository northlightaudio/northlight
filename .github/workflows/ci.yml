name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code. The cache and artifact steps use their own runtime
# token, not this one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    # A build with an empty compiler cache takes about 45 minutes; with a warm one,
    # far less (docs/building.md, "Build speed").
    timeout-minutes: 90
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 4G

    steps:
      - uses: actions/checkout@v7

      # What scripts/build.ps1 does: find Visual Studio, run vcvars64 and keep the
      # variables it changes for the later steps. (ilammy/msvc-dev-cmd did this,
      # but still runs on the deprecated Node.js 20.)
      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = cmd /c "`"$vcvars`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $lines) {
            $name, $value = $line -split '=', 2
            if ($value -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      # Restored and saved as separate steps so they are saved even when a test
      # fails: actions/cache on its own saves only when the whole job succeeds.
      - name: Restore fetched dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Each run saves a new entry and starts from the newest one; GitHub evicts
      # the oldest when the repository's caches pass their size limit.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      # Precompiled headers off: sccache cannot cache a compile that uses one, and
      # a build without them also catches a missing include.
      - name: Configure
        id: configure
        run: cmake --preset ci -DNORTHLIGHT_PCH=OFF -DNORTHLIGHT_COMPILER_CACHE=ON

      - name: Build
        id: build
        run: cmake --build --preset ci --parallel

      - name: Compiler cache statistics
        if: always() && steps.configure.outcome == 'success'
        run: sccache --stop-server

      - name: Save compiler cache
        if: always() && steps.configure.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}

      - name: Save fetched dependencies
        if: always() && steps.configure.outcome == 'success' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Test
        run: ctest --preset ci --label-exclude paced

      # Tests that run in real time need a free core when they wake, which a busy
      # four-core runner cannot promise, so they run one at a time after the rest.
      - name: Test (paced, one at a time)
        if: always() && steps.build.outcome == 'success'
        run: ctest --preset ci --label-regex paced --parallel 1

      # A failing test's stack report prints frames as module+offset; with these,
      # llvm-symbolizer turns them into lines (docs/building.md, "Tests").
      - name: Upload the test programs for symbolising
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-programs-${{ github.sha }}
          retention-days: 14
          path: |
            build/ci/tests/unit/northlight_unit_tests.exe
            build/ci/tests/unit/northlight_unit_tests.pdb
            build/ci/tests/unit_juce/northlight_juce_tests.exe
            build/ci/tests/unit_juce/northlight_juce_tests.pdb

      - name: Check formatting
        if: always()
        shell: pwsh
        run: |
          $files = git ls-files -- '*.cpp' '*.h'
          clang-format --dry-run --Werror $files
